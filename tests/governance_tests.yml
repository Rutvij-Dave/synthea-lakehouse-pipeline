version: "1.0"
architecture:
  name: synthea_er_medallion_architecture
  purpose: "Governed multi-format Synthea claims lakehouse."
layers:
  bronze: "Source-aligned raw data and lineage."
  silver: "Canonicalization, DQ, deduplication and quarantine."
  gold: "Dimensions and explicit-grain facts."
  reporting: "Business-facing reporting datasets."
  ai: "Downstream feature engineering and anomaly detection."
formats:
  - CSV
  - FHIR_R4
  - FHIR_STU3
  - FHIR_DSTU2
  - C-CDA
tests:
  - id: GOV-001
    name: claim_id_not_null
    layer: silver
    severity: critical
    rule: "claim_id IS NOT NULL"
  - id: GOV-002
    name: claim_grain_unique
    layer: silver
    severity: critical
    rule: "silver_claim_dedup has one row per claim_id"
  - id: GOV-003
    name: gold_grain_unique
    layer: gold
    severity: critical
    rule: "fact_claim has one row per claim_id"
  - id: GOV-004
    name: lineage_present
    layer: all
    severity: critical
    rule: "_ingest_ts, _record_source and _source_file retained"
  - id: GOV-005
    name: quarantine_auditability
    layer: silver
    severity: critical
    rule: "rejected records retain a reason"
  - id: GOV-006
    name: gold_reconciliation
    layer: gold
    severity: critical
    rule: "Gold fact row count reconciles to deduplicated Silver"
